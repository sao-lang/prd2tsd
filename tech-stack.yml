# PRD2TechSpec 技术栈声明
# 此文件是唯一权威的技术选型清单。
# 任何新依赖必须在此登记，黑名单中的库不得出现在任何 import 中。

framework:
  agent_orchestration: langgraph    # LangGraph StateGraph
  rag: none                         # 自实现（实体增强双路检索 + ReflectionJudge）
  llm_client: openai                # OpenAI SDK（兼容 DeepSeek API）

embedding:
  model: BAAI/bge-large-zh-v1.5
  dimension: 1024
  provider: huggingface             # sentence-transformers

storage:
  vector: pgvector                  # PostgreSQL 15 扩展（docker-compose postgres:15）
  graph: neo4j                      # 5.x Community
  cache: redis                      # 7.x
  object: minio                     # 文档/图片存储

# === 测试 & 质量 ===
test:
  runner: pytest
  async: pytest-asyncio
  linter: ruff
  type_checker: mypy

# === 黑名单（禁止引入） ===
forbidden:
  - chromadb                     # 已指定 PGVector
  - qdrant-client
  - weaviate-client
  - milvus
  - pinecone-client
  - flask
  - django

llm_models:
  primary: deepseek-v3
  fallback: gpt-4o-mini
  judge: gpt-4o-mini                # 评测用低成本模型

api:
  framework: fastapi
  async_worker: celery              # 已启用（docker-compose celery-worker）

observability:
  tracing: opentelemetry
  metrics: prometheus
  dashboard: grafana

document_parsing:
  pdf: pypdf                        # docling 未启用
  docx: python-docx
  html: 自实现正文提取（httpx，无 Readability 依赖）

# 白名单：允许导入的顶级包
allowed:
  - langgraph
  - langchain_core
  - langchain_openai
  - langchain_community
  - openai
  - fastapi
  - uvicorn
  - pydantic
  - pydantic_settings
  - sqlalchemy
  - asyncpg
  - alembic
  - psycopg
  - pgvector
  - neo4j
  - redis
  - minio
  - celery
  - prometheus_client
  - opentelemetry
  - sentence_transformers
  - torch
  - transformers
  - cohere
  - deepeval
  - weasyprint
  - fpdf2
  - python_docx
  - pypdf
  - markdown
  - PyYAML
  - httpx
  - jinja2
  - python_multipart
  - python_jose
  - passlib
  - bcrypt
  - aiosqlite
  - pytest
  - ruff
  - mypy

# 黑名单：禁止出现在任何 import 中
excluded:
  - chromadb
  - pinecone
  - weaviate
  - milvus
  - qdrant_client
